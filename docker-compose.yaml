services:
  app:
    container_name: fastapi-app
    build:
      context: .
      args:
        - BUILD_VERSION
    ports:
      - "8000:8000"
    environment:
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/tessdata
      - PYTHONPATH=/app
      - OMP_THREAD_LIMIT=2
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=postgres_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=vpr-logs
    depends_on:
      - db
      - minio

  ollama:
    image: ollama/ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_GPU=1
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_interaction:/root/.ollama_interaction
      - ./ollama_entrypoint.sh:/root/ollama_entrypoint.sh
    entrypoint: /root/ollama_entrypoint.sh
    profiles: ["ollama"]

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres_db
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - "5050:8080"

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /mnt/big_disk/minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rm -rf /root/.mc &&
      mc alias set s3 http://minio:9000 minioadmin minioadmin &&
      mc mb -p s3/vpr-logs || true &&
      mc anonymous set download s3/vpr-logs &&
      tail -f /dev/null
      "
  frontend:
    build:
      context: ./frontend
      dockerfile: DockerfileProd
    ports:
      - "80:8085"
    profiles: ["prod"]
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: DockerfileDev
    ports:
      - "5173:5173"
    profiles: ["dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
