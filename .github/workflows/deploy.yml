name: Deploy when main push

on:
  push:
    branches: [ main ]

env:
  VM_IP: ${{ secrets.VM_IP }}
  VM_USER: ${{ secrets.VM_USER }}
  VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
  PROJECT_PATH: /home/${{ secrets.VM_USER }}/app

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.VM_SSH_KEY }}

      - name: 3. Add remote server to known_hosts
        run: ssh-keyscan -H ${{ env.VM_IP }} >> ~/.ssh/known_hosts

      - name: 4. Sync files to a server
        run: |
          rsync -avz --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="venv/" \
            --exclude=".venv/" \
            --exclude="__pycache__/" \
            --exclude=".env" \
            --exclude="*.pyc" \
            ./ ${{ env.VM_USER }}@${{ env.VM_IP }}:${{ env.PROJECT_PATH }}/

      - name: 5. Rebuild and restart services on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          timeout: 60m
          script: |
            set -e
            
            echo "Deployment started on server"
            
            cd ${{ env.PROJECT_PATH }}

            echo "-> Starting keep-alive process..."
            while sleep 60; do echo "[Keep-Alive] Build is still in progress..."; done &
            KEEPALIVE_PID=$!
            trap 'kill $KEEPALIVE_PID' EXIT

            echo "-> Building image with cache enabled..."
            DOCKER_BUILDKIT=1 docker compose build --pull --progress=plain
            
            echo "-> Restarting containers with the new image..."
            BUILD_VERSION=${{ github.sha }} docker compose up -d
            
            echo "-> Build finished, stopping keep-alive process."
            kill $KEEPALIVE_PID
            trap - EXIT

            echo "-> Cleaning up old images..."
            docker image prune -f

            echo "-> Current container status:"
            docker compose ps
            echo "-> Recent logs:"
            docker compose logs --tail=50
            
            echo "Deployment finished!"
