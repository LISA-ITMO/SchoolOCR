name: Deploy when main push

on:
  push:
    branches: [ main ]

env:
  VM_IP: ${{ secrets.VM_IP }}
  VM_USER: ${{ secrets.VM_USER }}
  VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
  PROJECT_PATH: /home/${{ secrets.VM_USER }}/app

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.VM_SSH_KEY }}

      - name: 3. Add remote server to known_hosts
        run: ssh-keyscan -H ${{ env.VM_IP }} >> ~/.ssh/known_hosts

      - name: 4. Sync files to the server via rsync
        run: |
          rsync -avz --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="venv/" \
            --exclude=".venv/" \
            --exclude="__pycache__/" \
            --exclude=".env" \
            --exclude="*.pyc" \
            ./ ${{ env.VM_USER }}@${{ env.VM_IP }}:${{ env.PROJECT_PATH }}/

      - name: 5. Build and deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          timeout: 70m
          script: |
            set -e

            echo "::notice:: Starting deployment on server..."
            cd ${{ env.PROJECT_PATH }}

            echo "::notice:: Building image (max 60min)..."
            if ! timeout 60m bash -c 'export DOCKER_BUILDKIT=1 && docker compose build --pull --progress=plain'; then
              echo "::error:: Docker build timed out"
              exit 1
            fi

            echo "::notice:: Restarting containers with new image..."
            BUILD_VERSION=${{ github.sha }} docker compose up -d

            echo "::notice:: Cleaning up old Docker images..."
            docker image prune -f

            echo "::notice:: Current container status:"
            docker compose ps

            echo "::notice:: Recent logs:"
            docker compose logs --tail=50

            echo "::notice:: ✅ Deployment finished successfully"
